name: API Test
on:
  push:
    branches: [main]
jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Newman
        run: npm install -g newman
      - name: Run API tests
        run: newman run Collection.json -e Environment.json -d users.csv --env-var "token=${{ secrets.GOREST_TOKEN }}"
